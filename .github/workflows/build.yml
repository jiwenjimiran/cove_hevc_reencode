name: Build and Release Extension
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            ./scripts/package.ps1 -Version ($env:GITHUB_REF.Substring(11))
          } else {
            ./scripts/package.ps1
          }
      - name: Check encoder configuration and defaults
        run: dotnet run --project tests/EncoderChecks -c Release -p:UseLocalCovePlugins=false
      - uses: actions/upload-artifact@v4
        with:
          name: hevc-reencode
          path: artifacts/*.zip
          if-no-files-found: error
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*.zip
          body_path: docs/release-notes/${{ github.ref_name }}.md
